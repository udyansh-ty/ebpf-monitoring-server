basePath: /
definitions:
  api.ConnectionListResponse:
    properties:
      events_by_pid:
        additionalProperties:
          items: {}
          type: array
        description: Events grouped by PID
        type: object
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_events:
        description: Total number of events
        example: 10
        type: integer
      total_pids:
        description: Number of unique PIDs
        example: 3
        type: integer
    type: object
  api.ConnectionSummaryRequest:
    properties:
      command:
        description: Command name
        example: curl
        type: string
      duration_seconds:
        description: Duration in seconds
        example: 60
        type: integer
      pid:
        description: Process ID
        example: 1234
        type: integer
    type: object
  api.ConnectionSummaryResponse:
    properties:
      command:
        description: Command name
        example: curl
        type: string
      count:
        description: Number of connection events
        example: 5
        type: integer
      duration_seconds:
        description: Duration in seconds
        example: 60
        type: integer
      pid:
        description: Process ID
        example: 1234
        type: integer
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
    type: object
  api.EventFilters:
    properties:
      command:
        description: Command filter
        example: curl
        type: string
      limit:
        description: Limit filter
        example: 100
        type: integer
      pid:
        description: Process ID filter
        example: 1234
        type: integer
      since:
        description: Start time filter
        example: "2023-01-01T12:00:00Z"
        type: string
      type:
        description: Event type filter
        example: connection
        type: string
      until:
        description: End time filter
        example: "2023-01-01T13:00:00Z"
        type: string
    type: object
  api.EventsResponse:
    properties:
      count:
        description: Number of events returned
        example: 25
        type: integer
      events:
        description: List of events
        items: {}
        type: array
      filters:
        allOf:
        - $ref: '#/definitions/api.EventFilters'
        description: Applied filters
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_count:
        description: Total number of matching events
        example: 150
        type: integer
    type: object
  api.HealthResponse:
    properties:
      component:
        description: Component name
        example: eBPF Monitor API
        type: string
      status:
        description: Service status
        example: healthy
        type: string
      uptime:
        description: Service uptime
        example: 1h30m
        type: string
      version:
        description: API version
        example: 1.0.0
        type: string
    type: object
  api.PacketDropListResponse:
    properties:
      events_by_pid:
        additionalProperties:
          items: {}
          type: array
        description: Events grouped by PID
        type: object
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_events:
        description: Total number of events
        example: 7
        type: integer
      total_pids:
        description: Number of unique PIDs
        example: 2
        type: integer
    type: object
  api.PacketDropSummaryRequest:
    properties:
      command:
        description: Command name
        example: nginx
        type: string
      duration_seconds:
        description: Duration in seconds
        example: 60
        type: integer
      pid:
        description: Process ID
        example: 1234
        type: integer
    type: object
  api.PacketDropSummaryResponse:
    properties:
      command:
        description: Command name
        example: nginx
        type: string
      count:
        description: Number of packet drop events
        example: 3
        type: integer
      duration_seconds:
        description: Duration in seconds
        example: 60
        type: integer
      pid:
        description: Process ID
        example: 1234
        type: integer
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
    type: object
  api.ProgramInfo:
    properties:
      id:
        description: Program ID
        example: 123
        type: integer
      name:
        description: Program name
        example: connection_tracer
        type: string
      status:
        description: Program status
        example: loaded
        type: string
      type:
        description: Program type
        example: kprobe
        type: string
    type: object
  api.ProgramsResponse:
    properties:
      programs:
        description: List of eBPF programs
        items:
          $ref: '#/definitions/api.ProgramInfo'
        type: array
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_count:
        description: Total number of programs
        example: 2
        type: integer
    type: object
  internal_aggregator.AgentInfo:
    properties:
      event_count:
        description: Number of events from this agent
        example: 2500
        type: integer
      last_seen:
        description: Last seen timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      node_name:
        description: Node name
        example: worker-1
        type: string
      programs:
        description: Programs running on this agent
        items:
          $ref: '#/definitions/internal_aggregator.ProgramInfo'
        type: array
      status:
        description: Agent status
        example: active
        type: string
    type: object
  internal_aggregator.AggregatedEventFilters:
    properties:
      limit:
        description: Limit filter
        example: 100
        type: integer
      node:
        description: Node name filter
        example: worker-1
        type: string
      since:
        description: Start time filter
        example: "2023-01-01T12:00:00Z"
        type: string
      type:
        description: Event type filter
        example: connection
        type: string
      until:
        description: End time filter
        example: "2023-01-01T13:00:00Z"
        type: string
    type: object
  internal_aggregator.AggregatedEventsResponse:
    properties:
      count:
        description: Number of events returned
        example: 50
        type: integer
      events:
        description: List of aggregated events
        items: {}
        type: array
      filters:
        allOf:
        - $ref: '#/definitions/internal_aggregator.AggregatedEventFilters'
        description: Applied filters
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_count:
        description: Total number of matching events
        example: 1250
        type: integer
    type: object
  internal_aggregator.AggregatedListResponse:
    properties:
      events_by_node:
        additionalProperties:
          type: integer
        description: Event count by node
        type: object
      events_by_pid:
        additionalProperties:
          items: {}
          type: array
        description: Events grouped by PID
        type: object
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_events:
        description: Total number of events
        example: 45
        type: integer
      total_nodes:
        description: Number of nodes with events
        example: 3
        type: integer
      total_pids:
        description: Number of unique PIDs across all nodes
        example: 8
        type: integer
    type: object
  internal_aggregator.AggregatedSummaryResponse:
    properties:
      command:
        description: Command name (if filtered)
        example: curl
        type: string
      count:
        description: Total count across all nodes
        example: 15
        type: integer
      count_by_node:
        additionalProperties:
          type: integer
        description: Count by node
        type: object
      duration_seconds:
        description: Duration in seconds
        example: 60
        type: integer
      pid:
        description: Process ID (if filtered)
        example: 1234
        type: integer
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_nodes:
        description: Number of nodes with events
        example: 3
        type: integer
    type: object
  internal_aggregator.AggregationStatsResponse:
    properties:
      aggregation_start:
        description: When aggregation started
        example: "2023-01-01T10:00:00Z"
        type: string
      connected_agents:
        description: Number of connected agents
        example: 5
        type: integer
      events_by_node:
        additionalProperties:
          format: int64
          type: integer
        description: Events grouped by node
        type: object
      events_by_type:
        additionalProperties:
          format: int64
          type: integer
        description: Events grouped by type
        type: object
      last_event_time:
        description: Timestamp of last event
        example: "2023-01-01T12:00:00Z"
        type: string
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_events:
        description: Total events stored
        example: 12500
        type: integer
    type: object
  internal_aggregator.AggregatorProgramsResponse:
    properties:
      all_programs:
        description: All programs across agents
        items:
          $ref: '#/definitions/internal_aggregator.ProgramInfo'
        type: array
      connected_agents:
        description: List of connected agents
        items:
          $ref: '#/definitions/internal_aggregator.AgentInfo'
        type: array
      query_time:
        description: Query timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
      total_agents:
        description: Total number of agents
        example: 3
        type: integer
      total_programs:
        description: Total number of programs
        example: 6
        type: integer
    type: object
  internal_aggregator.HealthCheck:
    properties:
      component:
        type: string
      stats:
        additionalProperties: true
        type: object
      status:
        type: string
      uptime:
        type: string
    type: object
  internal_aggregator.IngestResponse:
    properties:
      events_processed:
        description: Number of events processed
        example: 25
        type: integer
      message:
        description: Status message
        example: Events ingested successfully
        type: string
      success:
        description: Ingestion success status
        example: true
        type: boolean
      timestamp:
        description: Processing timestamp
        example: "2023-01-01T12:00:00Z"
        type: string
    type: object
  internal_aggregator.ProgramInfo:
    properties:
      event_count:
        description: Events generated by this program
        example: 1250
        type: integer
      name:
        description: Program name
        example: connection_tracer
        type: string
      node:
        description: Node where program is running
        example: worker-1
        type: string
      status:
        description: Program status
        example: active
        type: string
      type:
        description: Program type
        example: kprobe
        type: string
    type: object
  l7.ErrorResponse:
    properties:
      error:
        description: HTTP error name
        example: Bad Request
        type: string
      message:
        description: Error message
        example: Invalid JSON format
        type: string
      timestamp:
        description: Error timestamp
        example: "2026-01-31T17:30:00Z"
        type: string
    type: object
  l7.WebhookCertificate:
    properties:
      expiry_ts:
        description: Expiration timestamp (Unix)
        type: integer
      issuer_cn:
        description: Issuer Common Name
        type: string
      issuer_sha256:
        description: Issuer certificate SHA256
        type: string
      leaf_sha256:
        description: Leaf certificate SHA256
        type: string
      public_key_sha256:
        description: Public key SHA256
        type: string
    type: object
  l7.WebhookEvent:
    properties:
      certificate:
        allOf:
        - $ref: '#/definitions/l7.WebhookCertificate'
        description: Certificate metadata
      direction:
        description: '"inbound" or "outbound"'
        type: string
      dst_ip:
        description: Destination IP address
        type: string
      dst_port:
        description: Destination port
        type: integer
      event_type:
        description: Flow identification
        type: string
      fingerprints:
        allOf:
        - $ref: '#/definitions/l7.WebhookFingerprints'
        description: TLS fingerprints
      flow_id:
        description: Human-readable flow identifier
        type: string
      flow_key:
        description: Unique flow key for deduplication
        type: string
      flow_start_ts:
        description: Flow start timestamp (ms)
        type: integer
      ip_version:
        description: 4 or 6
        type: integer
      metadata:
        additionalProperties: true
        description: Backward compatibility (v1.0)
        type: object
      observed_at:
        description: Observation timestamp (ms)
        type: integer
      protocol:
        description: '"tcp", "udp", "quic"'
        type: string
      src_ip:
        description: Network addresses
        type: string
      src_port:
        description: Source port
        type: integer
      stats:
        allOf:
        - $ref: '#/definitions/l7.WebhookStats'
        description: Statistics
      tls:
        allOf:
        - $ref: '#/definitions/l7.WebhookTLS'
        description: L7 security metadata
      verdict:
        allOf:
        - $ref: '#/definitions/l7.WebhookVerdict'
        description: Policy and verdict
    type: object
  l7.WebhookFingerprints:
    properties:
      ja3:
        description: MD5-based fingerprint
        type: string
      ja3_features:
        allOf:
        - $ref: '#/definitions/l7.WebhookJA3Features'
        description: JA3 component breakdown
      ja4:
        description: String-based fingerprint
        type: string
      ja4_plus:
        description: SHA256-based fingerprint
        type: string
    type: object
  l7.WebhookIngestionResponse:
    properties:
      events_failed:
        description: Events that failed
        example: 0
        type: integer
      events_processed:
        description: Events successfully processed
        example: 42
        type: integer
      message:
        description: Status message
        example: Processed 42/42 events from batch
        type: string
      schema_version:
        description: Schema version received
        example: "1.1"
        type: string
      success:
        description: Success status
        example: true
        type: boolean
      timestamp:
        description: Response timestamp
        example: "2026-01-31T17:30:00Z"
        type: string
      total_events:
        description: Total events in payload
        example: 42
        type: integer
    type: object
  l7.WebhookJA3Features:
    properties:
      cipher_count:
        description: Number of ciphers
        type: integer
      curve_count:
        description: Number of curves
        type: integer
      extension_count:
        description: Number of extensions
        type: integer
      point_formats:
        description: EC point formats count
        type: integer
    type: object
  l7.WebhookPayload:
    properties:
      batch_id:
        description: Batch deduplication ID
        type: string
      events:
        description: Batch of events
        items:
          $ref: '#/definitions/l7.WebhookEvent'
        type: array
      schema_version:
        description: Batch metadata
        type: string
      sent_at:
        description: RFC3339 timestamp
        type: string
      sequence:
        description: Monotonic sequence number
        type: integer
      source:
        description: Sensor identifier
        type: string
      source_instance:
        description: Instance identifier
        type: string
    type: object
  l7.WebhookQUIC:
    properties:
      dcid:
        description: Destination Connection ID
        type: string
    type: object
  l7.WebhookStats:
    properties:
      bytes:
        description: Total bytes transferred
        type: integer
      duration_ms:
        description: Flow duration in milliseconds
        type: integer
      extraction_latency_ms:
        description: Data extraction latency
        type: number
      ingest_latency_ms:
        description: Ingestion latency
        type: number
      packets:
        description: Total packets
        type: integer
      sensor_latency_ms:
        description: Sensor processing latency
        type: number
    type: object
  l7.WebhookStatsResponse:
    properties:
      average_payload_size:
        description: Average payload size (bytes)
        example: 28000
        type: integer
      duplicate_events:
        description: Duplicate events filtered
        example: 0
        type: integer
      event_success_rate:
        description: Success rate (%)
        example: 99.67
        type: number
      failed_events:
        description: Failed events
        example: 150
        type: integer
      failed_payloads:
        description: Failed payloads
        example: 5
        type: integer
      payload_success_rate:
        description: Success rate (%)
        example: 99.67
        type: number
      query_time:
        description: Query timestamp
        example: "2026-01-31T17:30:00Z"
        type: string
      total_events:
        description: Total events processed
        example: 45000
        type: integer
      total_payloads:
        description: Total payloads received
        example: 1500
        type: integer
      tracked_batches:
        description: Batches in dedup cache
        example: 500
        type: integer
    type: object
  l7.WebhookTLS:
    properties:
      alpn:
        description: Application-Layer Protocol Negotiation
        type: string
      quic:
        allOf:
        - $ref: '#/definitions/l7.WebhookQUIC'
        description: QUIC-specific information
      sni:
        description: Server Name Indication
        type: string
      version:
        description: TLS version (e.g., "771" for TLS 1.2)
        type: string
    type: object
  l7.WebhookVerdict:
    properties:
      action:
        description: '"allow", "deny", "log"'
        type: string
      cert_mismatch_action:
        description: Action taken on mismatch
        type: string
      cert_mismatch_reason:
        description: Reason for mismatch
        type: string
      cert_validation_level:
        description: '"standard", "strict", "none"'
        type: string
      priority:
        description: Rule priority
        type: integer
      rule_id:
        description: Policy rule identifier
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/srodi/ebpf-server/issues
  description: HTTP API for aggregating and querying eBPF events from multiple agents
  license:
    name: MIT
    url: https://github.com/srodi/ebpf-server/blob/main/LICENSE
  title: eBPF Event Aggregator API
  version: 1.0.0
paths:
  /api/connection-summary:
    get:
      consumes:
      - application/json
      description: Get count of connection events filtered by PID, command, and time
        window
      parameters:
      - description: Process ID
        in: query
        name: pid
        type: integer
      - description: Command name
        in: query
        name: command
        type: string
      - description: 'Duration in seconds (default: 60)'
        in: query
        name: duration_seconds
        type: integer
      - description: Connection summary request (POST only)
        in: body
        name: request
        schema:
          $ref: '#/definitions/api.ConnectionSummaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection statistics
          schema:
            $ref: '#/definitions/api.ConnectionSummaryResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get connection statistics
      tags:
      - connections
    post:
      consumes:
      - application/json
      description: Get count of connection events filtered by PID, command, and time
        window
      parameters:
      - description: Process ID
        in: query
        name: pid
        type: integer
      - description: Command name
        in: query
        name: command
        type: string
      - description: 'Duration in seconds (default: 60)'
        in: query
        name: duration_seconds
        type: integer
      - description: Connection summary request (POST only)
        in: body
        name: request
        schema:
          $ref: '#/definitions/api.ConnectionSummaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection statistics
          schema:
            $ref: '#/definitions/api.ConnectionSummaryResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get connection statistics
      tags:
      - connections
  /api/events:
    get:
      consumes:
      - application/json
      description: Get events filtered by type, PID, command, time range, and limit
      parameters:
      - description: Event type (connection, packet_drop)
        in: query
        name: type
        type: string
      - description: Process ID
        in: query
        name: pid
        type: integer
      - description: Command name
        in: query
        name: command
        type: string
      - description: Start time (RFC3339 format)
        in: query
        name: since
        type: string
      - description: End time (RFC3339 format)
        in: query
        name: until
        type: string
      - description: 'Maximum number of events to return (default: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Filtered events
          schema:
            $ref: '#/definitions/api.EventsResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Query events
      tags:
      - events
  /api/events/ingest:
    post:
      consumes:
      - application/json
      description: Accept events from eBPF agents for aggregation and storage
      parameters:
      - description: Events to ingest
        in: body
        name: events
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Ingestion result
          schema:
            $ref: '#/definitions/internal_aggregator.IngestResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Ingest events from agents
      tags:
      - events
  /api/l7/webhook:
    post:
      consumes:
      - application/json
      description: Ingests L7 telemetry (SSL/TLS, HTTP, DNS) from external sensors
      parameters:
      - description: Webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/l7.WebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/l7.WebhookIngestionResponse'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/l7.ErrorResponse'
        "409":
          description: Duplicate batch
          schema:
            $ref: '#/definitions/l7.ErrorResponse'
        "500":
          description: Storage error
          schema:
            $ref: '#/definitions/l7.ErrorResponse'
      summary: Receive L7 webhook events
      tags:
      - l7
  /api/l7/webhook/stats:
    get:
      consumes:
      - application/json
      description: Returns ingestion statistics for L7 webhooks
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/l7.WebhookStatsResponse'
      summary: Get webhook receiver statistics
      tags:
      - l7
  /api/list-connections:
    get:
      consumes:
      - application/json
      description: Get recent connection events grouped by PID
      produces:
      - application/json
      responses:
        "200":
          description: Connection events
          schema:
            $ref: '#/definitions/api.ConnectionListResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List connection events
      tags:
      - connections
  /api/list-packet-drops:
    get:
      consumes:
      - application/json
      description: Get recent packet drop events grouped by PID
      produces:
      - application/json
      responses:
        "200":
          description: Packet drop events
          schema:
            $ref: '#/definitions/api.PacketDropListResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List packet drop events
      tags:
      - packet_drops
  /api/packet-drop-summary:
    get:
      consumes:
      - application/json
      description: Get count of packet drop events filtered by PID, command, and time
        window
      parameters:
      - description: Process ID
        in: query
        name: pid
        type: integer
      - description: Command name
        in: query
